worker_processes auto;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;

  log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$req_id",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
  '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # Where the HTTP→HTTPS redirect should point. In production the ports are
  # standard, so the bare host is right. Compose maps TLS to 8443 in dev to
  # avoid claiming privileged ports on a developer's machine, and a redirect to
  # the default port would dead-end there — so translate that one case.
  map $http_host $https_host {
    default                  $host;
    "~^(?<h>[^:]+):8080$"    "$h:8443";
  }


  # Per-IP limit on the unauthenticated auth endpoints. The API already caps
  # attempts per account, which cannot see one address spraying a few guesses
  # at many accounts; this can. Generous enough for an office behind one NAT
  # signing in on a Monday morning, far too slow for a guessing script.
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
  limit_req_status 429;

  upstream grafana_upstream {
    server grafana:3000;
    keepalive 16;
  }

  # Plain HTTP exists only to send callers to HTTPS. Nothing is served here —
  # a session cookie must never travel over a connection anyone can read.
  server {
    listen 80 default_server;
    return 308 https://$https_host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # TLS 1.2 is the floor; 1.0/1.1 are broken and 1.3 is preferred. The cipher
    # list is the TLS 1.2 half — 1.3 negotiates its own suites.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: after the first visit the browser refuses plaintext on its own, so a
    # stripped-TLS attack cannot even reach the redirect above. Deliberately
    # without preload — that is a one-way submission to browser vendors and
    # belongs to whoever owns the real domain, not to this config.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app is same-origin and frames nothing; these cost nothing and close
    # the cheap classes of attack against a page that renders PII findings.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    location /api/ {
      # nginx resolves an `upstream` block's hostname ONCE, at config load. A
      # redeployed API container comes back with a new IP, and nginx keeps
      # dialling the old one until it is restarted — a 502 on every request,
      # for as long as nobody notices.
      #
      # Putting the target in a variable forces re-resolution per request,
      # through Docker's embedded DNS. proxy_pass with a variable and no URI
      # part passes the original request URI unchanged, which is what /api/
      # wants.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream "api:8080";

      # nginx defaults to 1m, which would reject document uploads with an HTML
      # 413 long before the API's 25 MiB ceiling. Kept deliberately ABOVE the
      # API's own limit (MAX_UPLOAD_BYTES + 1m of multipart overhead) so the
      # API rejects oversized bodies with a JSON error the SPA can parse;
      # nginx stays a backstop against absurd bodies.
      client_max_body_size 32m;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://$api_upstream;
    }

    # Sign-in and recovery: the same proxying as /api/ plus the per-IP limit.
    # A regex location wins over the /api/ prefix, so these never fall through.
    location ~ ^/api/v1/auth/(login|forgot-password|reset-password)$ {
      limit_req zone=auth_per_ip burst=20 nodelay;

      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream "api:8080";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://$api_upstream;
    }

    location /grafana/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://grafana_upstream/;
    }

    # SPA: unknown paths fall back to index.html so client-side routing (and
    # a plain refresh on a deep link) doesn't 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
