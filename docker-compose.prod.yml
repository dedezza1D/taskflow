services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on: [api, grafana]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Production certificates are mounted from outside the repository. Where
      # they come from — ACME/Let's Encrypt, or a corporate CA — is a deployment
      # decision; nginx only needs cert.pem and key.pem at this path.
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/tls:ro
    networks: [taskflow]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/deployments/migrations:/docker-entrypoint-initdb.d:ro
    networks: [taskflow]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    networks: [taskflow]

  # NATS Prometheus exporter (internal only)
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    restart: unless-stopped
    command:
      - "-connz"
      - "-routez"
      - "-subz"
      - "-varz"
      - "-jsz=all"
      - "http://nats:8222"
    depends_on:
      - nats
    networks: [taskflow]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    networks: [taskflow]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      ENV: "prod"
      HTTP_PORT: "8080"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://taskflow:taskflow@postgres:5432/taskflow?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      NATS_STREAM_NAME: "TASKFLOW"
      # The API writes each original here and the worker reads it back, so both
      # must mount the same volume at the same path. Left to the relative
      # default, each container gets a private directory: uploads return 201
      # and every document then dead-letters at OCR. config.Validate() refuses
      # a relative path with ENV=prod for exactly that reason.
      OBJECTS_DIR: "/data/objects"
      # ENV=prod also makes config.Validate() refuse AUTH_ENABLED=false.
      AUTH_ENABLED: "true"
      SECURE_COOKIES: "true"
      SESSION_TTL: "12h"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "taskflow-api"
    volumes:
      - objects_data:/data/objects
    depends_on: [postgres, nats]
    networks: [taskflow]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      ENV: "prod"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://taskflow:taskflow@postgres:5432/taskflow?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      NATS_STREAM_NAME: "TASKFLOW"
      NATS_CONSUMER_NAME: "taskflow-worker"
      WORKER_CONCURRENCY: "20"
      WORKER_METRICS_PORT: "9091"
      # Same volume, same path as the API — see the note there.
      OBJECTS_DIR: "/data/objects"
      # The worker sets no cookies, but it runs the same config.Validate() as
      # the API, and ENV=prod refuses SECURE_COOKIES=false. Without this line the
      # worker panics at startup and restarts forever: uploads are accepted and
      # nothing is ever processed.
      SECURE_COOKIES: "true"
      # Without this the default is English only, and every accented word in a
      # Brazilian scan is mangled. The image ships por, eng and deu.
      OCR_LANGS: "por+eng"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "taskflow-worker"
    volumes:
      - objects_data:/data/objects
    depends_on: [postgres, nats]
    networks: [taskflow]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [taskflow]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # nginx publishes Grafana at /grafana/ on the same public origin as the
      # app, and its Loki datasource holds the services' logs. Grafana's stock
      # admin:admin must never be the credential guarding that, so compose
      # refuses to start until an operator chooses one.
      #
      # Grafana reads this only when it first creates its database. On a
      # grafana_data volume that already exists, set it with:
      #   docker compose -f docker-compose.prod.yml exec grafana \
      #     grafana cli admin reset-admin-password '<new password>'
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD - Grafana is served publicly at /grafana/}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [taskflow]

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks: [taskflow]

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [taskflow]

  promtail:
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [taskflow]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://taskflow:taskflow@postgres:5432/taskflow?sslmode=disable"
    networks: [taskflow]

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  tempo_data:
  objects_data:

networks:
  taskflow:
    driver: bridge
